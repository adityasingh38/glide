<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      display: flex;
      align-items: center;
    }

    #ghost {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1;
      color: rgba(128, 128, 128, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    #hint {
      flex-shrink: 0;
      margin-left: 6px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 9px;
      color: rgba(128, 128, 128, 0.38);
      background: rgba(128, 128, 128, 0.07);
      border: 1px solid rgba(128, 128, 128, 0.14);
      border-radius: 3px;
      padding: 1px 4px;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <span id="ghost"></span>
  <span id="hint">Tab</span>
  <script>
    const ghost = document.getElementById('ghost')
    const hint = document.getElementById('hint')

    function setVisible(v) {
      ghost.style.display = v ? '' : 'none'
      hint.style.display = v ? '' : 'none'
    }
    setVisible(false)

    window.glide?.onSuggestionUpdate(text => {
      ghost.textContent = text
      setVisible(!!text)
    })
    window.glide?.onSuggestionAppend(token => {
      ghost.textContent += token
      setVisible(true)
    })
  </script>
</body>
</html>
