<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      display: flex;
      align-items: center;
    }

    #ghost {
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      /* line-height 1 so the glyphs sit centred on the caret's own centre line
         rather than being nudged down by leading */
      line-height: 1;
      /* Ghost text has to read as "not yet typed" against both light and dark
         hosts, so lean on a mid grey plus a faint dark halo for contrast. */
      color: rgba(150, 150, 155, 0.92);
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    #hint {
      flex-shrink: 0;
      margin-left: 8px;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 600;
      color: rgba(210, 210, 215, 0.72);
      background: rgba(70, 70, 78, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 3px;
      padding: 1px 4px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <span id="ghost"></span>
  <span id="hint">Tab</span>
  <script>
    const ghost = document.getElementById('ghost')
    const hint = document.getElementById('hint')

    function setVisible(v) {
      ghost.style.display = v ? '' : 'none'
      hint.style.display = v ? '' : 'none'
    }
    setVisible(false)

    // Report back so main can tell "painted" from "bridge missing". Previously
    // this file used window.glide?.on… — optional chaining meant a missing
    // bridge silently rendered nothing while main logged [SHOWING].
    function report() {
      try {
        window.glide.reportRendered({
          chars: ghost.textContent.length,
          visible: ghost.style.display !== 'none'
        })
      } catch (e) { /* bridge gone; nothing we can do from here */ }
    }

    if (!window.glide || typeof window.glide.onSuggestionUpdate !== 'function') {
      // Make the failure visible instead of silent
      document.title = 'GLIDE BRIDGE MISSING'
      ghost.textContent = '[Glide: preload bridge missing]'
      ghost.style.color = 'rgba(255,120,120,0.95)'
      setVisible(true)
    } else {
      window.glide.onSuggestionUpdate(text => {
        ghost.textContent = text
        setVisible(!!text)
        report()
      })
      window.glide.onSuggestionAppend(token => {
        ghost.textContent += token
        setVisible(true)
        report()
      })
    }
  </script>
</body>
</html>
