<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    #pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(9, 9, 11, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 6px 12px;
      max-width: 490px;
      margin: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    #text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }
    #hint {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    #dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.6);
      flex-shrink: 0;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="pill">
    <div id="dot"></div>
    <span id="text"></span>
    <span id="hint">Ctrl+Space</span>
  </div>
  <script>
    const textEl = document.getElementById('text')
    const dotEl = document.getElementById('dot')

    window.cotypist?.onSuggestionUpdate((text) => {
      textEl.textContent = text
      dotEl.style.animation = text ? 'pulse 1.2s ease-in-out infinite' : 'none'
    })
    window.cotypist?.onSuggestionAppend((token) => {
      textEl.textContent += token
    })
  </script>
</body>
</html>
